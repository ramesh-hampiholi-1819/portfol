<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101729" />
      <stop offset="100%" stop-color="#080B16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#rhGrad)" stroke-width="2.5" />
  
  <!-- Subtle Grid Pattern Lines -->
  <path d="M2 32 H62 M32 2 V62" stroke="#22D3EE" stroke-opacity="0.08" stroke-width="1" />
  
  <!-- RH Monogram Text / Vector Graphic -->
  <g fill="none" stroke="url(#rhGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- R -->
    <path d="M18 44 V20 H27 C31 20 33 22.5 33 26 C33 29.5 31 32 27 32 H18 M26 32 L33 44" />
    <!-- H -->
    <path d="M37 20 V44 M48 20 V44 M37 32 H48" />
  </g>
</svg>